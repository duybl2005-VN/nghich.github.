<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Thăm Dò Ý Kiến</title>
    <style>
        /* CÁCH 1: Căn chính giữa website cả chiều ngang và dọc */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f7f7f7;
        }

        /* 1. Bao quanh toàn bộ nội dung là một khung viền (border) màu đen */
        .survey-form {
            border: 1px solid black;
            width: 460px;
            padding: 15px 20px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        /* 2. Tiêu đề form: 'PHIẾU THĂM DÒ Ý KIẾN' (viết hoa, in đậm, căn giữa) */
        .form-title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin: 0 0 15px 0;
            text-transform: uppercase;
        }

        /* 3. Dòng nhập liệu đầu tiên: Tên đăng nhập và Giới tính trên cùng một dòng */
        .row-first {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .row-first input[type="text"] {
            width: 120px;
            margin-left: 5px;
            margin-right: 15px;
            padding: 2px 4px;
            border: 1px solid #777;
        }

        .gender-group {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-left: 5px;
        }

        .gender-group label {
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }

        /* 4. Dòng văn bản thứ hai */
        .row-second {
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* 5. Danh sách lựa chọn: 4 checkbox xếp thành một cột dọc, lề hơi lùi vào trong */
        .checkbox-list {
            margin-left: 25px;
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
        }

        .checkbox-list label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        /* 6. Dưới cùng: 2 nút bấm 'Gửi đi' (submit) và 'Phục Hồi' (reset) */
        .actions {
            text-align: center;
        }

        .actions input[type="submit"],
        .actions input[type="reset"] {
            padding: 3px 12px;
            margin: 0 4px;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <form class="survey-form" action="" method="post">
        <!-- Tiêu đề form -->
        <div class="form-title">PHIẾU THĂM DÒ Ý KIẾN</div>

        <!-- Dòng nhập liệu đầu tiên -->
        <div class="row-first">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username">

            <span>Giới tính :</span>
            <div class="gender-group">
                <label>
                    <input type="radio" name="gender" value="Nam" checked> Nam
                </label>
                <label>
                    <input type="radio" name="gender" value="Nữ"> Nữ
                </label>
            </div>
        </div>

        <!-- Dòng văn bản thứ hai -->
        <div class="row-second">
            Những mục bạn thường quan tâm trên Internet
        </div>

        <!-- Danh sách lựa chọn -->
        <div class="checkbox-list">
            <label>
                <input type="checkbox" name="interest" value="news"> Tin tức
            </label>
            <label>
                <input type="checkbox" name="interest" value="entertainment"> Giải trí
            </label>
            <label>
                <input type="checkbox" name="interest" value="study"> Góc học tập
            </label>
            <label>
                <input type="checkbox" name="interest" value="others"> Các mục khác
            </label>
        </div>

        <!-- Dưới cùng: Hai nút bấm -->
        <div class="actions">
            <input type="submit" value="Gửi đi">
            <input type="reset" value="Phục Hồi">
        </div>
    </form>

</body>
</html>
